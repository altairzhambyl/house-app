name: Production smoke tests

# Read-only checks against the live demo. Runs after every successful
# production deploy, weekly (which also keeps the free Supabase project from
# pausing), and on demand.
#
# Vercel's GitHub integration here reports deploys as a commit status named
# "Vercel" (it creates no GitHub Deployments, so deployment_status never
# fires). A successful "Vercel" status on a commit on main = production is live.
on:
  status:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: Site to test
        default: https://house-app-blush.vercel.app

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:prod
        env:
          SMOKE_URL: ${{ inputs.base_url || vars.PROD_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
