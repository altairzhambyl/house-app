[project]
name = "house-app-api"
version = "0.1.0"
description = "house-app backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "supabase>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
# An application, not a distributable package - do not try to build it.
package = false

[tool.ruff]
line-length = 100
